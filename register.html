<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - PureAir Mold Remediation & Air Quality Testing</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg?v=2">
  <meta name="description" content="Create your PureAir account to book inspections, view reports, and monitor your air quality.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  
  <script>
    tailwind.config = { 
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
          },
          colors: {
            'accent': '#0077B6',
            'secondary': '#005F8F',
            'brand-dark': '#1A1A1A',
            'brand-light': '#FFFFFF',
            'brand-muted': '#4B5563',
            'brand-surface': '#F8F9FA'
          }
        }
      }
    }
  </script>

  <style>
    [dir="rtl"] { direction: rtl; }
    html, body { height: 100%; overflow: hidden; }
    
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeInUp 0.5s ease-out; }

    /* Compact inputs */
    .input-compact {
      padding-top: 0.6rem;
      padding-bottom: 0.6rem;
    }

    /* Hide scrollbar inside card while keeping functionality */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body class="font-sans antialiased transition-colors duration-300 bg-brand-surface dark:bg-brand-dark h-screen overflow-hidden flex items-center justify-center p-3 sm:p-4">

  <!-- ==================== TOP RIGHT TOGGLES ==================== -->
  <div class="fixed top-3 end-3 sm:top-4 sm:end-5 z-50 flex items-center gap-2 sm:gap-3">

    <!-- Dark Mode Toggle -->
    <button id="theme-toggle" class="relative w-[68px] h-[30px] flex items-center bg-gray-200 dark:bg-[#1E293B] rounded-full p-1 transition-colors duration-300 focus:outline-none border border-gray-300 dark:border-gray-700 overflow-hidden" title="Toggle Theme">
      <span class="text-[9px] font-bold text-gray-600 dark:opacity-0 absolute end-2 transition-opacity duration-300 tracking-wider">LIGHT</span>
      <span class="text-[9px] font-bold text-accent absolute start-2 opacity-0 dark:opacity-100 transition-opacity duration-300 tracking-wider">DARK</span>
      
      <div class="w-[22px] h-[22px] bg-white dark:bg-brand-dark border border-gray-200 dark:border-gray-600 rounded-full shadow-sm transform transition-transform duration-300 flex items-center justify-center dark:translate-x-[38px] rtl:dark:-translate-x-[38px] z-10">
        <i class="fas fa-sun text-[10px] text-accent dark:hidden block"></i>
        <i class="fas fa-moon text-[10px] text-accent hidden dark:block"></i>
      </div>
    </button>

    <!-- RTL Toggle -->
    <button id="rtl-toggle" class="text-[10px] font-bold text-gray-500 dark:text-gray-400 hover:text-accent dark:hover:text-accent transition-colors duration-300 uppercase tracking-widest" title="Toggle RTL">
      RTL
    </button>

  </div>

  <!-- ==================== REGISTER CARD ==================== -->
  <div class="w-full max-w-[420px] animate-fade-in">

    <div class="bg-white dark:bg-[#1E293B] rounded-2xl shadow-2xl overflow-hidden border border-gray-100 dark:border-white/5">
      
      <!-- Top accent gradient bar -->
      <div class="h-1 bg-gradient-to-r from-accent via-accent to-secondary"></div>

      <div class="px-6 py-5 sm:px-7 sm:py-6">

        <!-- ==================== LOGO ==================== -->
        <a href="index.html" class="flex items-center justify-center gap-2.5 group mb-4">
          <div class="w-9 h-9 bg-brand-dark dark:bg-white rounded-lg flex items-center justify-center shadow-md transition-all duration-300 group-hover:scale-105 group-hover:bg-accent group-hover:shadow-accent/30 shrink-0">
            <svg class="w-5 h-5 text-accent dark:text-brand-dark group-hover:text-white transition-colors fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 1L2 6v12l10 5 10-5V6L12 1zm0 2.3l7.5 3.75-3.5 1.75-7.5-3.75L12 3.3zM4 7.8l7 3.5v8.4l-7-3.5V7.8zm9 11.9v-8.4l7-3.5v8.4l-7 3.5z"/>
            </svg>
          </div>
          <div class="flex flex-col">
            <span class="text-lg font-black tracking-tight text-brand-dark dark:text-brand-light uppercase leading-none">Pure<span class="text-accent">Air</span></span>
            <span class="text-[8px] font-bold tracking-[0.22em] text-accent uppercase mt-0.5 leading-none">Mold & Air Quality</span>
          </div>
        </a>

        <!-- ==================== HEADING ==================== -->
        <div class="text-center mb-4">
          <h1 class="text-lg sm:text-xl font-black text-brand-dark dark:text-white mb-1 tracking-tight uppercase">
            Create Account.
          </h1>
          <p class="text-[10px] font-semibold tracking-[0.15em] text-brand-muted dark:text-gray-400 uppercase">
            Join PureAir in 60 seconds
          </p>
        </div>

        <!-- ==================== FORM ==================== -->
        <form class="space-y-2.5">

          <!-- Full Name -->
          <div>
            <label for="name" class="block text-[10px] font-bold tracking-[0.15em] text-brand-dark dark:text-gray-300 uppercase mb-1">
              Full Name
            </label>
            <input 
              type="text" 
              id="name" 
              placeholder="John Doe" 
              class="input-compact w-full px-3.5 bg-white dark:bg-brand-dark border border-gray-200 dark:border-white/10 text-brand-dark dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent/20 transition-colors rounded-lg text-sm"
              required
            >
          </div>

          <!-- Email -->
          <div>
            <label for="email" class="block text-[10px] font-bold tracking-[0.15em] text-brand-dark dark:text-gray-300 uppercase mb-1">
              Email Address
            </label>
            <input 
              type="email" 
              id="email" 
              placeholder="your.email@example.com" 
              class="input-compact w-full px-3.5 bg-white dark:bg-brand-dark border border-gray-200 dark:border-white/10 text-brand-dark dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent/20 transition-colors rounded-lg text-sm"
              required
            >
          </div>

          <!-- Phone + Property Type (2-column) -->
          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label for="phone" class="block text-[10px] font-bold tracking-[0.15em] text-brand-dark dark:text-gray-300 uppercase mb-1">
                Phone
              </label>
              <input 
                type="tel" 
                id="phone" 
                placeholder="+91 98765 43210" 
                class="input-compact w-full px-3.5 bg-white dark:bg-brand-dark border border-gray-200 dark:border-white/10 text-brand-dark dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent/20 transition-colors rounded-lg text-sm"
                required
              >
            </div>
            <div>
              <label for="property" class="block text-[10px] font-bold tracking-[0.15em] text-brand-dark dark:text-gray-300 uppercase mb-1">
                Property
              </label>
              <select 
                id="property" 
                class="input-compact w-full px-3 bg-white dark:bg-brand-dark border border-gray-200 dark:border-white/10 text-brand-dark dark:text-white focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent/20 transition-colors rounded-lg text-sm appearance-none"
                required
              >
                <option value="">Select...</option>
                <option>Home</option>
                <option>Apartment</option>
                <option>Commercial</option>
                <option>Industrial</option>
              </select>
            </div>
          </div>

          <!-- Password -->
          <div>
            <label for="password" class="block text-[10px] font-bold tracking-[0.15em] text-brand-dark dark:text-gray-300 uppercase mb-1">
              Password
            </label>
            <div class="relative">
              <input 
                type="password" 
                id="password" 
                placeholder="Min. 8 characters" 
                class="input-compact w-full px-3.5 pe-10 bg-white dark:bg-brand-dark border border-gray-200 dark:border-white/10 text-brand-dark dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent/20 transition-colors rounded-lg text-sm"
                required
                minlength="8"
              >
              <button type="button" id="toggle-password" class="absolute end-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-accent transition-colors">
                <i class="fas fa-eye text-xs" id="eye-icon"></i>
              </button>
            </div>
          </div>

          <!-- Confirm Password -->
          <div>
            <label for="confirm-password" class="block text-[10px] font-bold tracking-[0.15em] text-brand-dark dark:text-gray-300 uppercase mb-1">
              Confirm Password
            </label>
            <div class="relative">
              <input 
                type="password" 
                id="confirm-password" 
                placeholder="Re-enter your password" 
                class="input-compact w-full px-3.5 pe-10 bg-white dark:bg-brand-dark border border-gray-200 dark:border-white/10 text-brand-dark dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:border-accent focus:ring-1 focus:ring-accent/20 transition-colors rounded-lg text-sm"
                required
              >
              <button type="button" id="toggle-confirm" class="absolute end-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-accent transition-colors">
                <i class="fas fa-eye text-xs" id="eye-icon-confirm"></i>
              </button>
            </div>
          </div>

          <!-- Terms -->
          <label class="flex items-start gap-2 cursor-pointer pt-0.5">
            <input type="checkbox" class="w-3.5 h-3.5 rounded border-gray-300 text-accent focus:ring-accent accent-accent mt-0.5" required>
            <span class="text-[10px] text-brand-muted dark:text-gray-400 leading-relaxed">
              I agree to the <a href="#" class="text-accent hover:underline font-bold">Terms</a> & <a href="#" class="text-accent hover:underline font-bold">Privacy Policy</a>
            </span>
          </label>

          <!-- Create Account Button -->
          <button type="submit" class="w-full bg-accent text-white font-bold uppercase tracking-[0.15em] text-xs py-3 rounded-full hover:bg-secondary transition-all duration-300 flex items-center justify-center gap-2 shadow-lg shadow-accent/25 hover:shadow-accent/40 mt-1">
            Create Account <i class="fas fa-arrow-right text-[10px] rtl:rotate-180"></i>
          </button>

        </form>

        <!-- ==================== DIVIDER ==================== -->
        <div class="relative my-3.5">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-200 dark:border-white/10"></div>
          </div>
          <div class="relative flex justify-center">
            <span class="px-3 bg-white dark:bg-[#1E293B] text-[9px] font-bold tracking-[0.2em] text-brand-muted dark:text-gray-500 uppercase">
              Or Sign Up With
            </span>
          </div>
        </div>

        <!-- ==================== SOCIAL SIGNUP ==================== -->
        <div class="grid grid-cols-3 gap-2">

          <!-- Google -->
          <button type="button" class="flex items-center justify-center gap-2 py-2.5 border-2 border-gray-200 dark:border-white/10 rounded-full hover:border-accent dark:hover:border-accent transition-colors bg-white dark:bg-transparent" title="Sign up with Google">
            <svg class="w-4 h-4" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
              <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4C12.955 4 4 12.955 4 24s8.955 20 20 20s20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
              <path fill="#FF3D00" d="m6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4C16.318 4 9.656 8.337 6.306 14.691z"/>
              <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
              <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
            </svg>
          </button>

          <!-- Apple -->
          <button type="button" class="flex items-center justify-center gap-2 py-2.5 border-2 border-gray-200 dark:border-white/10 rounded-full hover:border-accent dark:hover:border-accent transition-colors bg-white dark:bg-transparent" title="Sign up with Apple">
            <svg class="w-4 h-4" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path fill="#000000" class="dark:fill-white" d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
            </svg>
          </button>

          <!-- Facebook -->
          <button type="button" class="flex items-center justify-center gap-2 py-2.5 border-2 border-gray-200 dark:border-white/10 rounded-full hover:border-accent dark:hover:border-accent transition-colors bg-white dark:bg-transparent" title="Sign up with Facebook">
            <svg class="w-4 h-4" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
              <path fill="#FFFFFF" d="M16.671 15.544l.532-3.47h-3.328v-2.25c0-.949.465-1.874 1.956-1.874h1.513V4.996s-1.374-.235-2.686-.235c-2.741 0-4.533 1.662-4.533 4.669v2.644H7.078v3.47h3.047v8.385a12.09 12.09 0 0 0 3.75 0v-8.385h2.796z"/>
            </svg>
          </button>

        </div>

        <!-- ==================== FOOTER ==================== -->
        <p class="text-center text-[10px] font-bold tracking-[0.1em] text-brand-muted dark:text-gray-400 uppercase mt-4">
          Already have an account? 
          <a href="login.html" class="text-accent hover:text-secondary underline underline-offset-4 ms-1 transition-colors">
            Sign In
          </a>
        </p>

      </div>
    </div>

  </div>

  <script>
    // Theme Toggle
    const themeToggle = document.getElementById('theme-toggle');
    const html = document.documentElement;

    function toggleTheme() {
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      } else {
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
    }

    if (themeToggle) themeToggle.addEventListener('click', toggleTheme);
    if (localStorage.getItem('theme') === 'dark') html.classList.add('dark');

    // RTL Toggle
    const rtlToggle = document.getElementById('rtl-toggle');

    function toggleRTL() {
      if (html.getAttribute('dir') === 'rtl') {
        html.removeAttribute('dir');
        localStorage.setItem('direction', 'ltr');
      } else {
        html.setAttribute('dir', 'rtl');
        localStorage.setItem('direction', 'rtl');
      }
    }

    if (rtlToggle) rtlToggle.addEventListener('click', toggleRTL);
    if (localStorage.getItem('direction') === 'rtl') html.setAttribute('dir', 'rtl');

    // Password Visibility Toggle (main password)
    const togglePassword = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eye-icon');

    if (togglePassword && passwordInput && eyeIcon) {
      togglePassword.addEventListener('click', () => {
        if (passwordInput.type === 'password') {
          passwordInput.type = 'text';
          eyeIcon.classList.remove('fa-eye');
          eyeIcon.classList.add('fa-eye-slash');
        } else {
          passwordInput.type = 'password';
          eyeIcon.classList.remove('fa-eye-slash');
          eyeIcon.classList.add('fa-eye');
        }
      });
    }

    // Password Visibility Toggle (confirm password)
    const toggleConfirm = document.getElementById('toggle-confirm');
    const confirmInput = document.getElementById('confirm-password');
    const eyeIconConfirm = document.getElementById('eye-icon-confirm');

    if (toggleConfirm && confirmInput && eyeIconConfirm) {
      toggleConfirm.addEventListener('click', () => {
        if (confirmInput.type === 'password') {
          confirmInput.type = 'text';
          eyeIconConfirm.classList.remove('fa-eye');
          eyeIconConfirm.classList.add('fa-eye-slash');
        } else {
          confirmInput.type = 'password';
          eyeIconConfirm.classList.remove('fa-eye-slash');
          eyeIconConfirm.classList.add('fa-eye');
        }
      });
    }
  </script>
</body>
</html>
